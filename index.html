    if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith("PASTE")){app.innerHTML="<h2>Almost there</h2><p>Add your Firebase settings to <b>firebase-config.js</b> to start playing. See README.md for the steps.</p>";return}
    const fbApp=FB.initializeApp(cfg);rtdb=FB.getDatabase(fbApp);
    const auth=FB.getAuth(fbApp);const cred=await FB.signInAnonymously(auth);me=cred.user.uid;
    FB.onValue(FB.ref(rtdb,".info/serverTimeOffset"),s=>{off=s.val()||0});
    db=makeDb();
  }catch(e){console.error(e);app.innerHTML="<h2>Couldn't connect</h2><p>Check firebase-config.js and that Anonymous sign-in and Realtime Database are enabled (see README.md).</p><p class=\"err\">"+esc(e.message||e)+"</p>";return}
  const h=location.hash.slice(1);if(/^[A-Z0-9]{4,6}$/.test(h))S.prefill=h;
  render();
  setInterval(()=>{clock++;timerUpdate();hostDrive()},500);

function rid(){return Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("")}
const gref=()=>db.doc("games/"+code);
async function createGame(name){
  code=rid();await gref().set({host:me,phase:"lobby",round:0,word:"",words:[],endsAt:0,createdAt:NOW()});
  await joinWith(name);
}
async function joinGame(name,c){
  code=c.toUpperCase();const g=await gref().get();
  if(!g.exists){code=null;S.err="No game found with that code.";S.bad="cd";return render()}
  const ps=await db.collection("games/"+code+"/players").get();
  const exists=ps.docs.some(d=>d.id===me);
  if(g.data().phase==="ended"){code=null;S.err="That game has ended. Create a new one!";S.bad="cd";return render()}
  if(!exists&&ps.docs.length>=MAX){code=null;S.err="That game is full (10 players).";S.bad="cd";return render()}
  if(!exists&&g.data().phase!=="lobby"){code=null;S.err="That game has already started.";S.bad="cd";return render()}
  await joinWith(name);
}
async function joinWith(name){
  const ref=db.doc("games/"+code+"/players/"+me),s=await ref.get();
  if(!s.exists)await ref.set({name:name.slice(0,16),score:0,joinedAt:NOW()});
  history.replaceState(null,"","#"+code);subscribe();
}
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];
  // Only trust well-formed data from the database: numbers stay numbers, sketches must be JPEG data from a valid player id
  unsubs.push(gref().onSnapshot(s=>{const prev=game;game=s.data()||null;
    if(game){game.round=+game.round||0;game.lastAdd=Object.fromEntries(Object.entries(game.lastAdd||{}).map(([k,v])=>[k,+v||0]))}
    if(game&&game.phase==="ended"){const by=game.endedBy;S.err="";S.notice=by===me?"You ended the game.":`${pname(by)} ended the game.`;goHome();return}
    if(prev&&game&&(prev.phase!==game.phase||prev.round!==game.round)){if(game.phase==="voting")myPick=null;}
    render()}));
  unsubs.push(db.collection("games/"+code+"/players").onSnapshot(q=>{players=q.docs.map(d=>({id:d.id,...d.data(),score:+d.data().score||0})).sort((a,b)=>a.joinedAt-b.joinedAt);render()}));
  unsubs.push(db.collection("games/"+code+"/sketches").onSnapshot(q=>{sketches=q.docs.map(d=>({id:d.id,...d.data()})).filter(s=>/^[\w-]+$/.test(s.pid)&&/^data:image\/jpeg;base64,[\w+/=]+$/.test(s.img));if(game?.phase==="voting")render();else hostDrive()}));
  joinRoom();
  unsubs.push(db.collection("games/"+code+"/votes").onSnapshot(q=>{votes=q.docs.map(d=>({id:d.id,...d.data()}));if(game?.phase==="voting")render();hostDrive()}));
}
let roomOk=false,online=new Set(),offSince={};
async function joinRoom(){
  try{
    const myCode=code,pres=FB.ref(rtdb,"presence/"+code),mine=FB.ref(rtdb,"presence/"+code+"/"+me);
    const offConn=FB.onValue(FB.ref(rtdb,".info/connected"),async s=>{if(s.val()===true){await FB.onDisconnect(mine).remove();await FB.set(mine,true)}});
    const offPeers=FB.onValue(pres,snap=>{if(code!==myCode)return;const now=new Set(Object.keys(snap.val()||{}));
      online.forEach(id=>{if(!now.has(id))offSince[id]=NOW()});now.forEach(id=>delete offSince[id]);online=now;roomOk=true;render();hostDrive()});
    unsubs.push(()=>{offConn();offPeers();FB.remove(mine).catch(()=>{});roomOk=false;online=new Set();offSince={}});
  }catch(e){console.warn("presence",e)}
}
function isActive(id){if(id===me||!roomOk)return true;if(online.has(id))return true;return offSince[id]?NOW()-offSince[id]<15000:false}
const activePlayers=()=>players.filter(p=>isActive(p.id));
const canSelfVote=()=>activePlayers().length<=1;
function pickable(pid){return sketches.filter(s=>s.round===game.round&&(canSelfVote()||s.pid!==pid))}
function hasVoted(pid){if(!pickable(pid).length)return true;
  const v=votes.find(v=>v.round===game.round&&v.voter===pid);return!!(v&&v.pick)}
function effHost(){if(!game)return null;if(isActive(game.host)&&players.some(p=>p.id===game.host))return game.host;const a=activePlayers();return a[0]?.id||game.host}
const isHost=()=>!!game&&effHost()===me;
const color=id=>AVC[Math.max(0,players.findIndex(p=>p.id===id))%AVC.length];
const pname=id=>players.find(p=>p.id===id)?.name||"Player";
let driving=false;
async function hostDrive(){
  if(!isHost()||driving||!game)return;const now=NOW();driving=true;
  try{
    if(game.phase==="drawing"){
      const got=sketches.filter(s=>s.round===game.round).length;
      if(activePlayers().every(p=>sketches.some(s=>s.round===game.round&&s.pid===p.id))||now>game.endsAt+5000)await gref().update({phase:"voting",endsAt:now+VOTE_MS});
    }else if(game.phase==="voting"){
      if(activePlayers().every(p=>hasVoted(p.id))){
        const add={};votes.filter(v=>v.round===game.round&&v.pick&&(v.pick!==v.voter||canSelfVote())).forEach(v=>{add[v.pick]=(add[v.pick]||0)+1});
        for(const p of players){if(add[p.id])await db.doc("games/"+code+"/players/"+p.id).update({score:(p.score||0)+add[p.id]})}
        await gref().update({phase:"results",endsAt:now+30000,lastAdd:add,host:me});
      }
    }else if(game.phase==="results"&&now>game.endsAt){
      if(game.round>=ROUNDS)await gref().update({phase:"final"});
      else await gref().update({phase:"drawing",round:game.round+1,word:game.words[game.round],endsAt:now+DRAW_MS});
    }
  }catch(e){console.warn(e)}finally{driving=false}
}
async function startGame(){
  const w=[...WORDS].sort(()=>Math.random()-.5).slice(0,ROUNDS);
  for(const p of players)if(p.score)await db.doc("games/"+code+"/players/"+p.id).update({score:0});
  await gref().update({phase:"drawing",round:1,words:w,word:w[0],endsAt:NOW()+DRAW_MS,lastAdd:{}});
}
function timerUpdate(){
  const t=$("#tm");if(!t||!game)return;const total=game.phase==="drawing"?DRAW_MS:game.phase==="voting"?VOTE_MS:30000;
  const left=Math.max(0,game.endsAt-NOW()),sec=Math.ceil(left/1000);
  t.querySelector("b").textContent=sec;const c=t.querySelector(".fg");c.style.strokeDashoffset=226*(1-left/total);
  c.style.stroke=sec<=10?"#E05555":"#4CC38A";if(game.phase!=="drawing"&&game.phase!=="voting")return;
  if(game.phase==="drawing"&&left<=0&&!submitted[game.round])submitSketch();
  if(game.phase==="voting"&&left<=0&&!$("#tm").dataset.over){$("#tm").dataset.over=1;render()}
}
function timerHTML(){return`<div class="timer" id="tm"><svg width="78" height="78"><circle cx="39" cy="39" r="36" fill="none" stroke="var(--line)" stroke-width="6"/><circle class="fg" cx="39" cy="39" r="36" fill="none" stroke="#4CC38A" stroke-width="6" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="0"/></svg><b>60</b></div>`}
function av(p){return`<div class="av" style="background:${color(p.id)}">${esc((p.name||"?")[0].toUpperCase())}</div>`}
let drawnKey="";
function openEndModal(){const m=$("#md");m.hidden=false;$("#mdn").focus();
  const close=()=>{m.hidden=true};$("#mdn").onclick=close;m.onclick=e=>{if(e.target===m)close()};m.onkeydown=e=>{if(e.key==="Escape")close()};
  $("#mdy").onclick=async()=>{const b=$("#mdy");b.disabled=true;b.textContent="Ending...";
    try{if(code)await gref().update({phase:"ended",endedBy:me,endsAt:0})}catch(e){console.warn(e)}
    b.disabled=false;b.textContent="End game";close();S.notice="You ended the game.";goHome()}}
function goHome(){$("#md").hidden=true;unsubs.forEach(u=>u());unsubs=[];code=null;game=null;players=[];sketches=[];votes=[];myPick=null;drawnKey="";history.replaceState(null,"",location.pathname+location.search);render()}
function render(){
  applyTheme();
  const eg=$("#eg");eg.hidden=!code||game?.phase==="final";eg.onclick=openEndModal;
  if(!code){
    app.innerHTML=`<h1>Draw it with your <span style="color:var(--acct)">other</span> hand</h1>
    <p>A sketch game for 10 players. 5 rounds, 60 seconds each, then vote for favorites.</p>
    ${S.notice?`<div class="hint">${esc(S.notice)}</div>`:""}
    <div class="start"><label for="nm">Your name</label><input id="nm" maxlength="16" placeholder="e.g. Alex" value="${esc(S.name||"")}"${S.bad==="nm"?' class="bad" aria-invalid="true"':""}>
    ${S.err&&S.bad==="nm"?`<div class="err">${esc(S.err)}</div>`:""}
    <div class="paths"><button class="btn" id="cr">Create a game</button><div class="or">or</div>
    <div class="join"><input id="cd" maxlength="6" placeholder="Game code" aria-label="Game code" value="${esc(S.prefill||"")}" style="text-transform:uppercase"${S.bad==="cd"?' class="bad" aria-invalid="true"':""}><button class="btn ghost" id="jn">Join</button></div></div>
    ${S.err&&S.bad!=="nm"?`<div class="err">${esc(S.err)}</div>`:""}</div>
    <section class="instr"><h2>Instructions</h2><div class="steps">${STEPS.map(([t,d,e,bg,sh,dd],i)=>`<div class="step" style="--sbg:${bg};--ssh:${sh}"><span class="num">${i+1}</span><div class="emo" aria-hidden="true">${e}</div><h3>${t}</h3><p>${d}</p><svg class="dood" viewBox="0 0 100 100" aria-hidden="true">${dd}</svg></div>`).join("")}</div></section>`;
    if(S.bad)$("#"+S.bad).focus();
    ["nm","cd"].forEach(id=>$("#"+id).oninput=e=>{if(S.bad===id){S.bad="";e.target.classList.remove("bad");e.target.removeAttribute("aria-invalid")}});
    const nm=()=>{const v=$("#nm").value.trim();S.name=v;S.prefill=$("#cd").value.trim();if(!v){S.err="Enter your name first.";S.bad="nm";render();return null}S.err="";S.bad="";return v};
    $("#cr").onclick=async()=>{const n=nm();S.notice="";if(n)await createGame(n)};
    $("#jn").onclick=async()=>{const n=nm();const c=$("#cd").value.trim();if(!n)return;if(!c){S.err="Enter a game code.";S.bad="cd";return render()}await joinGame(n,c)};
    return;
  }
  if(!game){app.innerHTML="<p>Loading game…</p>";return}
  const ph=game.phase;
  if(ph==="lobby"){
    const link=location.href;
    app.innerHTML=`<div class="row" style="justify-content:space-between"><div><p style="margin:0">Game code</p><div class="code">${code}</div></div><span class="pill">👥 ${players.length}/${MAX}</span></div>
    <p style="margin-top:12px">Share the code or invite link so friends can join.</p>
    <div class="row"><input class="grow" id="il" readonly value="${INVITE}#${code}"><button class="btn ghost" id="cp">Copy invite link</button></div>
    <div class="players">${players.map(p=>`<div class="pl">${av(p)}<div>${esc(p.name)}${p.id===game.host?' <span class="muted">👑</span>':""}${p.id===me?' <span class="muted">(you)</span>':""}</div></div>`).join("")}</div>
    ${isHost()?`<button class="btn" id="st">Start game</button>`:`<p>Waiting for the host to start…</p>`}`;
    $("#cp").onclick=async()=>{const i=$("#il");try{await navigator.clipboard.writeText(i.value)}catch(e){i.select();try{document.execCommand("copy")}catch(_){}}$("#cp").textContent="Copied!";setTimeout(()=>{const b=$("#cp");if(b)b.textContent="Copy invite link"},1800)};
    if(isHost())$("#st").onclick=startGame;return;
  }
  if(ph==="drawing"){
    const key=code+game.round;
    if(drawnKey===key&&$("#cv")){updateDrawStatus();return}
    drawnKey=key;
    app.innerHTML=`<div class="hud"><div><span class="pill">Round ${game.round} of ${ROUNDS}</span><div class="word">${esc(game.word)}</div></div>${timerHTML()}</div>
    <div class="hint">✋ Non dominant hand only!</div>
    <div class="canvasbox"><canvas id="cv" width="800" height="600"></canvas></div>
    <div class="tools"><div class="pal"><div class="cols">${COLORS.map(c=>`<button class="sw${c===pen.c?" on":""}" data-c="${c}" style="background:${c};${c==="#FFFFFF"?"box-shadow:inset 0 0 0 1px #ccc":""}" aria-label="colour"></button>`).join("")}</div>
    <div class="szs">${[4,10,22].map(s=>`<button class="sz${s===pen.s?" on":""}" data-s="${s}"><span style="width:${s/1.6+3}px;height:${s/1.6+3}px;border-radius:50%;background:currentColor"></span></button>`).join("")}</div>
    </div><div class="acts"><button class="btn lite" id="un" style="padding:8px 14px">Undo</button><button class="btn lite" id="cl" style="padding:8px 14px">Clear</button>
    <button class="btn tert" id="dn" style="padding:8px 22px">Done</button></div></div><p id="ds" class="muted" style="margin-top:10px"></p>`;

    <div class="hint" style="${over?"":"background:#DDF5E9;color:#0F5C3B"}">${over&&waiting?`Time's up! Waiting for ${waiting} to pick a favourite...`:`${done.length}/${act.length} players have picked a favourite`}</div>
    <div class="grid">${list.map(s=>{const own=s.pid===me&&!self;return own?`<div class="sk own"><img src="${s.img}" alt="your sketch"><div class="row" style="margin-top:14px">${av({id:s.pid,name:pname(s.pid)})}<b>${esc(pname(s.pid))}</b><span class="muted">(you)</span></div><p class="center" style="margin:14px 0 0">You can't vote for your own sketch</p></div>`:`<div class="sk pick${myPick===s.pid?" sel":""}" data-p="${s.pid}" role="button" tabindex="0">${myPick===s.pid?`<span class="badge">✓ Your favourite</span>`:""}<img src="${s.img}" alt="sketch"><div class="row" style="margin-top:14px">${av({id:s.pid,name:pname(s.pid)})}<b>${esc(pname(s.pid))}</b>${s.pid===me?'<span class="muted">(you)</span>':""}</div>
      <button class="btn ${myPick===s.pid?"tert":"lite"}" style="width:100%;margin-top:14px">${myPick===s.pid?"Selected":"My favourite"}</button></div>`}).join("")||"<p>No sketches came in this round.</p>"}</div>`;
    app.querySelectorAll(".sk.pick").forEach(c=>{const go=()=>{myPick=c.dataset.p;render();saveVotes()};c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});

function updateDrawStatus(){const d=$("#ds");if(!d)return;const n=sketches.filter(s=>s.round===game.round).length,tot=activePlayers().length;

let ctx,cv,strokes=[],cur=null,pen={c:"#2A1416",s:matchMedia("(max-width:600px)").matches?4:10};
function setupCanvas(){
  cv=$("#cv");ctx=cv.getContext("2d");strokes=[];cur=null;redraw();
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{if(submitted[game.round])return;cv.setPointerCapture(e.pointerId);cur={c:pen.c,s:pen.s,p:[pos(e)]};strokes.push(cur);redraw()};
  cv.onpointermove=e=>{if(!cur)return;cur.p.push(pos(e));redraw()};
  cv.onpointerup=cv.onpointercancel=()=>cur=null;
  app.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{pen.c=b.dataset.c;app.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b))});
  app.querySelectorAll(".sz").forEach(b=>b.onclick=()=>{pen.s=+b.dataset.s;app.querySelectorAll(".sz").forEach(x=>x.classList.toggle("on",x===b))});
  $("#un").onclick=()=>{strokes.pop();redraw()};$("#cl").onclick=()=>{strokes=[];redraw()};$("#dn").onclick=submitSketch;
}
function redraw(){ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.lineCap=ctx.lineJoin="round";
  for(const s of strokes){ctx.strokeStyle=ctx.fillStyle=s.c;ctx.lineWidth=s.s;if(s.p.length===1){ctx.beginPath();ctx.arc(s.p[0][0],s.p[0][1],s.s/2,0,7);ctx.fill();continue}
    ctx.beginPath();ctx.moveTo(...s.p[0]);for(const p of s.p.slice(1))ctx.lineTo(...p);ctx.stroke()}}
async function submitSketch(){
  if(!game||game.phase!=="drawing"||submitted[game.round]||!cv)return;const r=game.round;submitted[r]=true;
  const t=document.createElement("canvas");t.width=480;t.height=360;const tc=t.getContext("2d");tc.drawImage(cv,0,0,480,360);
  const img=t.toDataURL("image/jpeg",0.7);updateDrawStatus();
  try{await db.doc("games/"+code+"/sketches/r"+r+"_"+me).set({round:r,pid:me,img})}catch(e){submitted[r]=false;console.warn(e)}
}
let saving=false,dirty=false;
async function saveVotes(){
  if(!game||game.phase!=="voting")return;if(saving){dirty=true;return}
  saving=true;const r=game.round;
  try{do{dirty=false;await db.doc("games/"+code+"/votes/r"+r+"_"+me).set({round:r,voter:me,pick:myPick})}while(dirty)}catch(e){console.warn(e)}finally{saving=false}
}
// Logo goes back to the home screen (a normal page load if we never connected); mid game it asks to end the game first
$("#hm").onclick=e=>{if(!db)return;e.preventDefault();if(!$("#eg").hidden)return openEndModal();S.err=S.notice=S.bad="";goHome()};
init();
