</style></head><body>
<div class="top"><div class="brand"><div class="logo">✍️</div><span style="flex:1">I can't draw</span><button class="endbtn" id="eg" hidden>End game</button></div></div>
<div class="wrap"><div class="card" id="app"><p>Loading…</p></div></div>
<div class="modal" id="md" hidden role="dialog" aria-modal="true" aria-labelledby="mdt"><div class="mbox"><div style="font-size:50px">🛑</div><h2 id="mdt">End the game?</h2><p>This stops the game for everyone and takes all players back to the home screen. Scores will be lost.</p><div class="row" style="justify-content:center"><button class="btn ghost" id="mdn">Keep playing</button><button class="btn" id="mdy">End game</button></div></div></div>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,update,remove,onValue,onDisconnect} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const FB={initializeApp,getDatabase,ref,get,set,update,remove,onValue,onDisconnect,getAuth,signInAnonymously};
let rtdb,off=0;const NOW=()=>Date.now()+off;
// Small adapter: documents and collections on top of Firebase Realtime Database
const P=path=>{const seg=path.split("/");return seg.length===2?path+"/meta":path};
const docSnap=(id,v)=>({id,exists:v!==null&&v!==undefined,data:()=>v||undefined});
const colSnap=v=>({docs:Object.entries(v||{}).filter(([k])=>k!=="meta").map(([k,d])=>({id:k,data:()=>d}))});
function makeDb(){return{
  doc:path=>{const r=FB.ref(rtdb,P(path)),id=path.split("/").pop();return{
    get:async()=>docSnap(id,(await FB.get(r)).val()),
    set:v=>FB.set(r,v),update:v=>FB.update(r,v),
    onSnapshot:cb=>FB.onValue(r,s=>cb(docSnap(id,s.val())),e=>console.warn(e))}},
  collection:path=>{const r=FB.ref(rtdb,path);return{
    get:async()=>colSnap((await FB.get(r)).val()),
    onSnapshot:cb=>FB.onValue(r,s=>cb(colSnap(s.val())),e=>console.warn(e))}}
}}

const WORDS=["cat","bicycle","pizza","rocket","giraffe","lighthouse","umbrella","guitar","snowman","octopus","castle","banana","dragon","teapot","cactus","robot","volcano","penguin","hamburger","helicopter","mermaid","tractor","sandcastle","butterfly","skateboard","crown","dinosaur","windmill","ice cream","spider","submarine","palm tree","camera","owl","sunflower","train","ghost","shark","hot air balloon","toothbrush"];
const INVITE=location.origin+location.pathname,ROUNDS=5,DRAW_MS=60000,VOTE_MS=30000,MAX=10,COLORS=["#2A1416","#E3262E","#FF8A00","#FFC23D","#22A06B","#2D7FF9","#8B5CF6","#8B5A2B","#9AA0A6","#FFFFFF"];
const AVC=["#FFE488","#57D5C3","#B9E5FD","#FCD5F8","#FFAAAA","#A699FF","#CECECE","#FFF0B8","#A8EADF","#D3CCFF"];
// Round themes from the palette: bg, shadow, text-on-accent, accent text (light bg), accent text (dark bg), tint light
const THEMES=[
 ["#A699FF","#7F70E6","#202020","#5442C9","#A699FF","#E6E2FF"], // Core: lavender (home / lobby / final)
 ["#FFE488","#E0BE4A","#202020","#7A5C00","#FFE488","#FFF5D2"], // R1 yellow
 ["#57D5C3","#2FAF9C","#202020","#00705F","#57D5C3","#D6F5F0"], // R2 aqua
 ["#B9E5FD","#86C3E6","#202020","#1B638F","#B9E5FD","#E6F5FE"], // R3 sky
 ["#FCD5F8","#E3A7DC","#202020","#9C2C8E","#FCD5F8","#FEF0FC"], // R4 pink
 ["#FFAAAA","#E07C7C","#202020","#B23A3A","#FFAAAA","#FFE4E4"]  // R5 coral
];
let themeIdx=-1;
function applyTheme(){
  const i=game&&game.round&&!["lobby","final","ended"].includes(game.phase)?((game.round-1)%5)+1:0;
  if(i===themeIdx)return;themeIdx=i;const t=THEMES[i],st=document.documentElement.style;
  [["--red",0],["--red2",1],["--on",2],["--accL",3],["--accD",4],["--tintL",5]].forEach(([k,j])=>st.setProperty(k,t[j]));
  const h=t[0].slice(1),rgb=[0,2,4].map(k=>parseInt(h.slice(k,k+2),16)).join(",");st.setProperty("--tintD",`rgba(${rgb},.2)`);
}
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let myPick=null,db,me,code,game=null,players=[],sketches=[],votes=[],unsubs=[],myVotes={},submitted={},tick,clock=0;
const S={view:"home",err:""};
async function init(){
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith("PASTE")){app.innerHTML="<h2>Almost there</h2><p>Add your Firebase settings to <b>firebase-config.js</b> to start playing. See README.md for the steps.</p>";return}
    const fbApp=FB.initializeApp(cfg);rtdb=FB.getDatabase(fbApp);
    const auth=FB.getAuth(fbApp);const cred=await FB.signInAnonymously(auth);me=cred.user.uid;
    FB.onValue(FB.ref(rtdb,".info/serverTimeOffset"),s=>{off=s.val()||0});
    db=makeDb();
  }catch(e){console.error(e);app.innerHTML="<h2>Couldn't connect</h2><p>Check firebase-config.js and that Anonymous sign-in and Realtime Database are enabled (see README.md).</p><p class=\"err\">"+esc(e.message||e)+"</p>";return}
  const h=location.hash.slice(1);if(/^[A-Z0-9]{4,6}$/.test(h))S.prefill=h;
  render();
  setInterval(()=>{clock++;timerUpdate();hostDrive()},500);
}
function rid(){return Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0]).join("")}
const gref=()=>db.doc("games/"+code);
async function createGame(name){
  code=rid();await gref().set({host:me,phase:"lobby",round:0,word:"",words:[],endsAt:0,createdAt:NOW()});
  await joinWith(name);
}
async function joinGame(name,c){
  code=c.toUpperCase();const g=await gref().get();
  if(!g.exists){code=null;S.err="No game found with that code.";return render()}
  const ps=await db.collection("games/"+code+"/players").get();
  const exists=ps.docs.some(d=>d.id===me);
  if(g.data().phase==="ended"){code=null;S.err="That game has ended. Create a new one!";return render()}
  if(!exists&&ps.docs.length>=MAX){code=null;S.err="That game is full (10 players).";return render()}
  if(!exists&&g.data().phase!=="lobby"){code=null;S.err="That game has already started.";return render()}
  await joinWith(name);
}
async function joinWith(name){
  const ref=db.doc("games/"+code+"/players/"+me),s=await ref.get();
  if(!s.exists)await ref.set({name:name.slice(0,16),score:0,joinedAt:NOW()});
  history.replaceState(null,"","#"+code);subscribe();
}
function subscribe(){
  unsubs.forEach(u=>u());unsubs=[];
  unsubs.push(gref().onSnapshot(s=>{const prev=game;game=s.data()||null;
    if(game&&game.phase==="ended"){const by=game.endedBy;S.err="";S.notice=by===me?"You ended the game.":`${pname(by)} ended the game.`;goHome();return}
    if(prev&&game&&(prev.phase!==game.phase||prev.round!==game.round)){if(game.phase==="voting")myPick=null;}
    render()}));
  unsubs.push(db.collection("games/"+code+"/players").onSnapshot(q=>{players=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.joinedAt-b.joinedAt);render()}));
  unsubs.push(db.collection("games/"+code+"/sketches").onSnapshot(q=>{sketches=q.docs.map(d=>({id:d.id,...d.data()}));if(game?.phase==="voting")render();else hostDrive()}));
  joinRoom();
  unsubs.push(db.collection("games/"+code+"/votes").onSnapshot(q=>{votes=q.docs.map(d=>({id:d.id,...d.data()}));if(game?.phase==="voting")render();hostDrive()}));
}
let roomOk=false,online=new Set(),offSince={};
async function joinRoom(){
  try{
    const myCode=code,pres=FB.ref(rtdb,"presence/"+code),mine=FB.ref(rtdb,"presence/"+code+"/"+me);
    const offConn=FB.onValue(FB.ref(rtdb,".info/connected"),async s=>{if(s.val()===true){await FB.onDisconnect(mine).remove();await FB.set(mine,true)}});
    const offPeers=FB.onValue(pres,snap=>{if(code!==myCode)return;const now=new Set(Object.keys(snap.val()||{}));
      online.forEach(id=>{if(!now.has(id))offSince[id]=NOW()});now.forEach(id=>delete offSince[id]);online=now;roomOk=true;render();hostDrive()});
    unsubs.push(()=>{offConn();offPeers();FB.remove(mine).catch(()=>{});roomOk=false;online=new Set();offSince={}});
  }catch(e){console.warn("presence",e)}
}
function isActive(id){if(id===me||!roomOk)return true;if(online.has(id))return true;return offSince[id]?NOW()-offSince[id]<15000:false}
const activePlayers=()=>players.filter(p=>isActive(p.id));
const canSelfVote=()=>activePlayers().length<=1;
function pickable(pid){return sketches.filter(s=>s.round===game.round&&(canSelfVote()||s.pid!==pid))}
function hasVoted(pid){if(!pickable(pid).length)return true;
  const v=votes.find(v=>v.round===game.round&&v.voter===pid);return!!(v&&v.pick)}
function effHost(){if(!game)return null;if(isActive(game.host)&&players.some(p=>p.id===game.host))return game.host;const a=activePlayers();return a[0]?.id||game.host}
const isHost=()=>!!game&&effHost()===me;
const color=id=>AVC[Math.max(0,players.findIndex(p=>p.id===id))%AVC.length];
const pname=id=>players.find(p=>p.id===id)?.name||"Player";
let driving=false;
async function hostDrive(){
  if(!isHost()||driving||!game)return;const now=NOW();driving=true;
  try{
    if(game.phase==="drawing"){
      const got=sketches.filter(s=>s.round===game.round).length;
      if(activePlayers().every(p=>sketches.some(s=>s.round===game.round&&s.pid===p.id))||now>game.endsAt+5000)await gref().update({phase:"voting",endsAt:now+VOTE_MS});
    }else if(game.phase==="voting"){
      if(activePlayers().every(p=>hasVoted(p.id))){
        const add={};votes.filter(v=>v.round===game.round&&v.pick&&(v.pick!==v.voter||canSelfVote())).forEach(v=>{add[v.pick]=(add[v.pick]||0)+1});
        for(const p of players){if(add[p.id])await db.doc("games/"+code+"/players/"+p.id).update({score:(p.score||0)+add[p.id]})}
        await gref().update({phase:"results",endsAt:now+30000,lastAdd:add,host:me});
      }
    }else if(game.phase==="results"&&now>game.endsAt){
      if(game.round>=ROUNDS)await gref().update({phase:"final"});
      else await gref().update({phase:"drawing",round:game.round+1,word:game.words[game.round],endsAt:now+DRAW_MS});
    }
  }catch(e){console.warn(e)}finally{driving=false}
}
async function startGame(){
  const w=[...WORDS].sort(()=>Math.random()-.5).slice(0,ROUNDS);
  for(const p of players)if(p.score)await db.doc("games/"+code+"/players/"+p.id).update({score:0});
  await gref().update({phase:"drawing",round:1,words:w,word:w[0],endsAt:NOW()+DRAW_MS,lastAdd:{}});
}
function timerUpdate(){
  const t=$("#tm");if(!t||!game)return;const total=game.phase==="drawing"?DRAW_MS:game.phase==="voting"?VOTE_MS:30000;
  const left=Math.max(0,game.endsAt-NOW()),sec=Math.ceil(left/1000);
  t.querySelector("b").textContent=sec;const c=t.querySelector(".fg");c.style.strokeDashoffset=226*(1-left/total);
  c.style.stroke=sec<=10?"#E05555":"#4CC38A";if(game.phase!=="drawing"&&game.phase!=="voting")return;
  if(game.phase==="drawing"&&left<=0&&!submitted[game.round])submitSketch();
  if(game.phase==="voting"&&left<=0&&!$("#tm").dataset.over){$("#tm").dataset.over=1;render()}
}
function timerHTML(){return`<div class="timer" id="tm"><svg width="78" height="78"><circle cx="39" cy="39" r="36" fill="none" stroke="var(--line)" stroke-width="6"/><circle class="fg" cx="39" cy="39" r="36" fill="none" stroke="#4CC38A" stroke-width="6" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="0"/></svg><b>60</b></div>`}
function av(p){return`<div class="av" style="background:${color(p.id)}">${esc((p.name||"?")[0].toUpperCase())}</div>`}
let drawnKey="";
function openEndModal(){const m=$("#md");m.hidden=false;$("#mdn").focus();
  const close=()=>{m.hidden=true};$("#mdn").onclick=close;m.onclick=e=>{if(e.target===m)close()};m.onkeydown=e=>{if(e.key==="Escape")close()};
  $("#mdy").onclick=async()=>{const b=$("#mdy");b.disabled=true;b.textContent="Ending...";
    try{if(code)await gref().update({phase:"ended",endedBy:me,endsAt:0})}catch(e){console.warn(e)}
    b.disabled=false;b.textContent="End game";close();S.notice="You ended the game.";goHome()}}
function goHome(){$("#md").hidden=true;unsubs.forEach(u=>u());unsubs=[];code=null;game=null;players=[];sketches=[];votes=[];myPick=null;drawnKey="";history.replaceState(null,"",location.pathname+location.search);render()}
function render(){
  applyTheme();
  const eg=$("#eg");eg.hidden=!code;eg.onclick=openEndModal;
  if(!code){
    app.innerHTML=`<h1>Draw it with your <span style="color:var(--acct)">other</span> hand</h1>
    <p>A party sketch game for up to 10 players. 5 rounds, 60 seconds each, then everyone votes for their favourite.</p>
    <input id="nm" maxlength="16" placeholder="Your name" value="${esc(S.name||"")}"${S.bad==="nm"?' class="bad" aria-invalid="true"':""}>
    <div class="row" style="margin-top:18px"><button class="btn" id="cr">Create a game</button></div>
    <div class="row" style="margin-top:28px"><input class="grow${S.bad==="cd"?" bad":""}" id="cd" maxlength="6" placeholder="Game code" value="${esc(S.prefill||"")}" style="text-transform:uppercase"><button class="btn ghost" id="jn">Join</button></div>
    ${S.notice?`<div class="hint" style="margin:18px 0 0">${esc(S.notice)}</div>`:""}${S.err?`<div class="err">${esc(S.err)}</div>`:""}
    <section class="instr"><h2>Instructions</h2><div class="steps"><div class="step"><b>1.</b> Swap hands. Draw with your non dominant hand only.</div><div class="step"><b>2.</b> Sketch the prompt before the 60 second timer runs out.</div><div class="step"><b>3.</b> Vote for your favourite sketch each round.</div><div class="step"><b>4.</b> Most votes after 5 rounds wins.</div></div></section>`;
    if(S.bad)$("#"+S.bad).focus();
    ["nm","cd"].forEach(id=>$("#"+id).oninput=e=>{if(S.bad===id){S.bad="";e.target.classList.remove("bad");e.target.removeAttribute("aria-invalid")}});
    const nm=()=>{const v=$("#nm").value.trim();S.name=v;if(!v){S.err="Enter your name first.";S.bad="nm";render();return null}S.err="";S.bad="";return v};
    $("#cr").onclick=async()=>{const n=nm();S.notice="";if(n)await createGame(n)};
    $("#jn").onclick=async()=>{const n=nm();const c=$("#cd").value.trim();if(!n)return;if(!c){S.err="Enter a game code.";S.bad="cd";return render()}await joinGame(n,c)};
    return;
  }
  if(!game){app.innerHTML="<p>Loading game…</p>";return}
  const ph=game.phase;
  if(ph==="lobby"){
    const link=location.href;
    app.innerHTML=`<div class="row" style="justify-content:space-between"><div><p style="margin:0">Game code</p><div class="code">${code}</div></div><span class="pill">👥 ${players.length}/${MAX}</span></div>
    <p style="margin-top:12px">Share the code or invite link so friends can join.</p>
    <div class="row"><input class="grow" id="il" readonly value="${INVITE}#${code}"><button class="btn ghost" id="cp">Copy invite link</button></div>
    <div class="players">${players.map(p=>`<div class="pl">${av(p)}<div>${esc(p.name)}${p.id===game.host?' <span class="muted">👑</span>':""}${p.id===me?' <span class="muted">(you)</span>':""}</div></div>`).join("")}</div>
    ${isHost()?`<button class="btn" id="st">Start game</button>`:`<p>Waiting for the host to start…</p>`}`;
    $("#cp").onclick=async()=>{const i=$("#il");try{await navigator.clipboard.writeText(i.value)}catch(e){i.select();try{document.execCommand("copy")}catch(_){}}$("#cp").textContent="Copied!";setTimeout(()=>{const b=$("#cp");if(b)b.textContent="Copy invite link"},1800)};
    if(isHost())$("#st").onclick=startGame;return;
  }
  if(ph==="drawing"){
    const key=code+game.round;
    if(drawnKey===key&&$("#cv")){updateDrawStatus();return}
    drawnKey=key;
    app.innerHTML=`<div class="hud"><div><span class="pill">Round ${game.round} of ${ROUNDS}</span><div class="word">${esc(game.word)}</div></div>${timerHTML()}</div>
    <div class="hint">✋ Non dominant hand only!</div>
    <div class="canvasbox"><canvas id="cv" width="800" height="600"></canvas></div>
    <div class="tools"><div class="pal"><div class="cols">${COLORS.map(c=>`<button class="sw${c===pen.c?" on":""}" data-c="${c}" style="background:${c};${c==="#FFFFFF"?"box-shadow:inset 0 0 0 1px #ccc":""}" aria-label="colour"></button>`).join("")}</div>
    <div class="szs">${[4,10,22].map(s=>`<button class="sz${s===pen.s?" on":""}" data-s="${s}"><span style="width:${s/1.6+3}px;height:${s/1.6+3}px;border-radius:50%;background:currentColor"></span></button>`).join("")}</div>
    </div><div class="acts"><button class="btn ghost" id="dm" style="padding:8px 14px" title="Let the game draw it for you (no promises)">🪄 Draw it for me</button><button class="btn tert" id="un" style="padding:8px 14px">Undo</button><button class="btn tert" id="cl" style="padding:8px 14px">Clear</button>
    <button class="btn" id="dn" style="padding:8px 22px">Done</button></div></div><p id="ds" class="muted" style="margin-top:10px"></p>`;
    setupCanvas();updateDrawStatus();timerUpdate();return;
  }
  drawnKey="";
  if(ph==="voting"){
    const list=sketches.filter(s=>s.round===game.round);
    const act=activePlayers(),done=act.filter(p=>hasVoted(p.id)),self=canSelfVote(),over=NOW()>=game.endsAt;
    const waiting=act.filter(p=>!hasVoted(p.id)).map(p=>esc(p.name)).join(", ");
    const W=game.word.replace(/\b\w/g,c=>c.toUpperCase());
    app.innerHTML=`<div class="hud"><div><span class="pill">Round ${game.round} · Voting</span><h2 style="margin-top:14px">Vote for your favourite '${esc(W)}' sketch</h2><p style="margin:0">Pick one. You can change your pick until the timer ends.</p></div>${timerHTML()}</div>
    <div class="hint" style="${over?"":"background:#DDF5E9;color:#0F5C3B"}">${over&&waiting?`Time's up! Waiting for ${waiting} to pick a favourite...`:`${done.length}/${act.length} players have picked a favourite`}</div>
    <div class="grid">${list.map(s=>{const own=s.pid===me&&!self;return own?`<div class="sk own"><img src="${s.img}" alt="your sketch"><div class="row" style="margin-top:14px">${av({id:s.pid,name:pname(s.pid)})}<b>${esc(pname(s.pid))}</b><span class="muted">(you)</span></div><p class="center" style="margin:14px 0 0">You can't vote for your own sketch</p></div>`:`<div class="sk pick${myPick===s.pid?" sel":""}" data-p="${s.pid}" role="button" tabindex="0">${myPick===s.pid?`<span class="badge">✓ Your favourite</span>`:""}<img src="${s.img}" alt="sketch"><div class="row" style="margin-top:14px">${av({id:s.pid,name:pname(s.pid)})}<b>${esc(pname(s.pid))}</b>${s.pid===me?'<span class="muted">(you)</span>':""}</div>
      <button class="btn ${myPick===s.pid?"":"ghost"}" style="width:100%;margin-top:14px">${myPick===s.pid?"Selected":"Pick this one"}</button></div>`}).join("")||"<p>No sketches came in this round.</p>"}</div>`;
    app.querySelectorAll(".sk.pick").forEach(c=>{const go=()=>{myPick=c.dataset.p;render();saveVotes()};c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
    timerUpdate();
    return;
  }
  if(ph==="results"||ph==="final"){
    const ranked=[...players].sort((a,b)=>(b.score||0)-(a.score||0)),add=game.lastAdd||{};
    const fin=ph==="final";
    const you=p=>p.id===me?' <span class="muted">(you)</span>':"";
    if(fin){
      const M=["🥇","🥈","🥉"],cls=["first","second","third"];
      app.innerHTML=`<div class="trophy">🏆</div><h1 class="center">${esc(ranked[0]?.name)} wins!</h1><p class="center">${ranked[0]?.score||0} votes after ${ROUNDS} rounds</p>
      <div class="pod">${ranked.slice(0,3).map((p,i)=>`<div class="pl ${cls[i]}" style="justify-content:space-between"><div class="row"><span class="medal">${M[i]}</span>${av(p)}<b>${i===0?"👑 ":""}${esc(p.name)}</b>${you(p)}</div><span class="pill">⭐ ${p.score||0} ${(p.score||0)===1?"vote":"votes"}</span></div>`).join("")}</div>
      ${ranked.length>3?`<div class="sub">Everyone else</div><div class="board" style="display:grid;gap:12px;margin-top:14px">${ranked.slice(3).map((p,i)=>`<div class="pl"><div class="row"><span class="rank">${i+4}</span>${av(p)}<b>${esc(p.name)}</b>${you(p)}</div><span class="pill">⭐ ${p.score||0} ${(p.score||0)===1?"vote":"votes"}</span></div>`).join("")}</div>`:""}
      <div class="row" style="margin-top:32px;justify-content:center">${isHost()?`<button class="btn" id="ag">Play again</button>`:`<span class="muted">The host can start a rematch.</span>`}<button class="btn ghost" id="lv">Leave</button></div>`;
    }else{
      app.innerHTML=`<div class="hud"><div><span class="pill">Round ${game.round} results</span><h2 style="margin-top:14px">Leaderboard</h2><p style="margin:0">${game.round<ROUNDS?"Next round starts soon...":"Final scores when the timer ends"}</p></div>${timerHTML()}</div>
      <div class="board" style="display:grid;gap:12px">${ranked.map((p,i)=>`<div class="pl"><div class="row"><span class="rank">${i+1}</span>${av(p)}<b>${esc(p.name)}</b>${you(p)}</div><div class="row">${add[p.id]?`<span class="pill" style="color:var(--ok)">+${add[p.id]}</span>`:""}<span class="pill">⭐ ${p.score||0} ${(p.score||0)===1?"vote":"votes"}</span></div></div>`).join("")}</div>
      <div class="row" style="margin-top:28px;justify-content:center"><button class="btn" id="nx">${game.round<ROUNDS?"Start next round":"See final results"} →</button></div>`;
      $("#nx").onclick=async()=>{$("#nx").disabled=true;try{await gref().update({endsAt:NOW()})}catch(e){$("#nx").disabled=false}};
      timerUpdate();
    }
    if(fin){if(isHost())$("#ag").onclick=startGame;$("#lv").onclick=goHome}
  }
}
function updateDrawStatus(){const d=$("#ds");if(!d)return;const n=sketches.filter(s=>s.round===game.round).length,tot=activePlayers().length;
  d.textContent=submitted[game.round]?`Sketch sent! ${n}/${tot} finished`:`${n}/${tot} players finished`;
  if(submitted[game.round]){$("#dn").disabled=true;$("#cv").style.pointerEvents="none"}}
let ctx,cv,strokes=[],cur=null,pen={c:"#2A1416",s:matchMedia("(max-width:600px)").matches?4:10};
function setupCanvas(){
  cv=$("#cv");ctx=cv.getContext("2d");strokes=[];cur=null;redraw();
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{if(submitted[game.round])return;cv.setPointerCapture(e.pointerId);cur={c:pen.c,s:pen.s,p:[pos(e)]};strokes.push(cur);redraw()};
  cv.onpointermove=e=>{if(!cur)return;cur.p.push(pos(e));redraw()};
  cv.onpointerup=cv.onpointercancel=()=>cur=null;
  app.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{pen.c=b.dataset.c;app.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b))});
  app.querySelectorAll(".sz").forEach(b=>b.onclick=()=>{pen.s=+b.dataset.s;app.querySelectorAll(".sz").forEach(x=>x.classList.toggle("on",x===b))});
  $("#dm").onclick=drawForMe;
  $("#un").onclick=()=>{strokes.pop();redraw()};$("#cl").onclick=()=>{strokes=[];redraw()};$("#dn").onclick=submitSketch;
}
// "Draw it for me": deliberately draws something unrelated to the prompt
const J=(v,a)=>v+(Math.random()-.5)*a;
function circ(cx,cy,r,c,w){const p=[];for(let a=0;a<=Math.PI*2+.2;a+=.18)p.push([J(cx+Math.cos(a)*r,6),J(cy+Math.sin(a)*r,6)]);return{c,s:w||8,p}}
function ln(pts,c,w){const p=[];for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[x,y]=pts[i+1];for(let t=0;t<=1;t+=.1)p.push([J(a+(x-a)*t,5),J(b+(y-b)*t,5)])}return{c,s:w||8,p}}
const DECOYS={
  sun:()=>[circ(400,300,100,"#FF8A00",10),...Array.from({length:10},(_,i)=>{const a=i/10*Math.PI*2;return ln([[400+Math.cos(a)*130,300+Math.sin(a)*130],[400+Math.cos(a)*200,300+Math.sin(a)*200]],"#FFC23D",8)}),circ(365,280,8,"#2A1416",6),circ(435,280,8,"#2A1416",6),ln([[360,335],[400,355],[440,335]],"#2A1416",7)],
  house:()=>[ln([[260,300],[540,300],[540,500],[260,500],[260,300]],"#8B5A2B",9),ln([[240,310],[400,170],[560,310]],"#E3262E",10),ln([[370,500],[370,410],[430,410],[430,500]],"#2A1416",8),ln([[290,340],[340,340],[340,385],[290,385],[290,340]],"#2D7FF9",7),ln([[460,340],[510,340],[510,385],[460,385],[460,340]],"#2D7FF9",7)],
  fish:()=>[circ(380,300,120,"#2D7FF9",9),ln([[490,300],[600,220],[600,380],[490,300]],"#2D7FF9",9),circ(320,280,12,"#2A1416",8),ln([[270,330],[300,340]],"#2A1416",6),ln([[160,200],[175,180]],"#9AA0A6",5),circ(200,170,12,"#9AA0A6",5)],
  flower:()=>[ln([[400,320],[400,540]],"#22A06B",10),ln([[400,450],[470,410]],"#22A06B",9),...[0,1,2,3,4,5].map(i=>{const a=i/6*Math.PI*2;return circ(400+Math.cos(a)*65,240+Math.sin(a)*65,42,"#E0457B",8)}),circ(400,240,32,"#FFC23D",12)],
  stickman:()=>[circ(400,170,50,"#2A1416",8),ln([[400,220],[400,390]],"#2A1416",8),ln([[310,280],[400,260],[490,280]],"#2A1416",8),ln([[330,520],[400,390],[470,520]],"#2A1416",8),ln([[380,180],[400,195],[420,180]],"#2A1416",5)],
  snail:()=>[circ(430,330,110,"#8B5A2B",9),circ(430,330,60,"#8B5A2B",7),circ(430,330,20,"#8B5A2B",6),ln([[200,440],[620,440]],"#22A06B",9),ln([[320,440],[250,440],[230,380],[260,360],[320,420]],"#9AA0A6",8),ln([[245,365],[230,300]],"#9AA0A6",5),ln([[262,362],[275,300]],"#9AA0A6",5)],
  boat:()=>[ln([[220,400],[580,400],[520,470],[280,470],[220,400]],"#8B5A2B",9),ln([[400,400],[400,170]],"#2A1416",8),ln([[410,180],[540,370],[410,370]],"#E3262E",9),ln([[120,500],[200,480],[280,505],[360,480],[440,505],[520,480],[600,505],[680,480]],"#2D7FF9",8)],
  smiley:()=>[circ(400,300,170,"#FFC23D",11),circ(340,250,18,"#2A1416",10),circ(460,250,18,"#2A1416",10),ln([[310,350],[360,395],[440,395],[490,350]],"#E3262E",10)]
};
let animating=false;
function drawForMe(){
  if(animating||!game||submitted[game.round])return;
  const w=(game.word||"").toLowerCase(),keys=Object.keys(DECOYS).filter(k=>!w.includes(k)&&!k.includes(w));
  const out=DECOYS[keys[Math.random()*keys.length|0]](),b=$("#dm");animating=true;if(b){b.disabled=true;b.textContent="🪄 Drawing..."}
  let si=0,pi=0,cur2=null;
  const step=()=>{if(!cv||!game||submitted[game.round]||si>=out.length){animating=false;const bb=$("#dm");if(bb){bb.disabled=false;bb.textContent="🪄 Draw it for me"}return}
    const src=out[si];if(!cur2){cur2={c:src.c,s:src.s,p:[]};strokes.push(cur2)}
    for(let k=0;k<3&&pi<src.p.length;k++)cur2.p.push(src.p[pi++]);redraw();
    if(pi>=src.p.length){si++;pi=0;cur2=null}requestAnimationFrame(step)};
  step();
}
function redraw(){ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.lineCap=ctx.lineJoin="round";
  for(const s of strokes){ctx.strokeStyle=ctx.fillStyle=s.c;ctx.lineWidth=s.s;if(s.p.length===1){ctx.beginPath();ctx.arc(s.p[0][0],s.p[0][1],s.s/2,0,7);ctx.fill();continue}
    ctx.beginPath();ctx.moveTo(...s.p[0]);for(const p of s.p.slice(1))ctx.lineTo(...p);ctx.stroke()}}
async function submitSketch(){
  if(!game||game.phase!=="drawing"||submitted[game.round]||!cv)return;const r=game.round;submitted[r]=true;
  const t=document.createElement("canvas");t.width=480;t.height=360;const tc=t.getContext("2d");tc.drawImage(cv,0,0,480,360);
  const img=t.toDataURL("image/jpeg",0.7);updateDrawStatus();
  try{await db.doc("games/"+code+"/sketches/r"+r+"_"+me).set({round:r,pid:me,img})}catch(e){submitted[r]=false;console.warn(e)}
}
let saving=false,dirty=false;
async function saveVotes(){
  if(!game||game.phase!=="voting")return;if(saving){dirty=true;return}
  saving=true;const r=game.round;
  try{do{dirty=false;await db.doc("games/"+code+"/votes/r"+r+"_"+me).set({round:r,voter:me,pick:myPick})}while(dirty)}catch(e){console.warn(e)}finally{saving=false}
}
init();
</script></body></html>
